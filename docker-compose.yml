services:
  spark-master:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-master
    user: root
    command: ["/usr/local/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Cluster submit port
    volumes:
      - ./data:/data            # shared "warehouse" — simulates S3/HDFS for lessons
    networks: [spark-net]

  spark-worker:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-worker
    user: root
    command:
      - "/usr/local/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "--memory"
      - "2g"
      - "--cores"
      - "2"
      - "spark://spark-master:7077"
    environment:
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - PYSPARK_PYTHON=/opt/conda/bin/python
    volumes:
      - ./data:/data
    depends_on: [spark-master]
    networks: [spark-net]

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: spark-jupyter
    user: root
    ports:
      - "8888:8888"   # JupyterLab
      - "4040:4040"   # Spark Application UI (per active job)
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.7-src.zip
      - PYSPARK_PYTHON=/opt/conda/bin/python
      - PYSPARK_DRIVER_PYTHON=/opt/conda/bin/python
    depends_on: [spark-master, spark-worker]
    networks: [spark-net]

networks:
  spark-net:
    driver: bridge
